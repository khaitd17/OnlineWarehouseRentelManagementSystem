<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Warehouse – Premium Logo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(ellipse at center, #060d1f 0%, #020509 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* ── Ambient background particles ── */
    .bg-grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(0,210,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,210,255,.03) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* ── Outer glow ring (animated) ── */
    .logo-scene {
      position: relative;
      width: 320px; height: 320px;
      display: flex; align-items: center; justify-content: center;
      z-index: 1;
    }

    /* Rotating outer conic ring */
    .ring-outer {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #00d2ff, #3a7bd5, #00d2ff, #0052d4, #00d2ff
      );
      animation: spin 6s linear infinite;
      filter: blur(0px);
    }
    .ring-outer::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #0a1628;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Glassmorphism main circle */
    .logo-circle {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 40% 35%, rgba(0,180,255,.18) 0%, rgba(10,22,40,.95) 65%);
      border: 1px solid rgba(0,210,255,.25);
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 60px rgba(0,180,255,.35),
        0 0 120px rgba(0,100,255,.18),
        inset 0 1px 0 rgba(255,255,255,.1),
        inset 0 0 40px rgba(0,180,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Breathing pulse glow */
    .logo-circle::before {
      content: '';
      position: absolute;
      inset: -30%;
      background: radial-gradient(circle, rgba(0,210,255,.12) 0%, transparent 70%);
      animation: pulse 3.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(.9); opacity: .6; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    /* ── Circular text (SVG) ── */
    .circular-text {
      position: absolute;
      inset: 0;
      z-index: 3;
      animation: spin-slow 18s linear infinite;
    }

    @keyframes spin-slow { to { transform: rotate(360deg); } }

    .circular-text text {
      font-family: 'Orbitron', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      fill: rgba(180,230,255,.75);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* ── The SVG icon (cube) ── */
    .icon-wrap {
      position: relative;
      z-index: 4;
      filter:
        drop-shadow(0 0 8px #00d2ff)
        drop-shadow(0 0 24px rgba(0,180,255,.6))
        drop-shadow(0 0 48px rgba(0,120,255,.35));
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    /* Shine sweep on icon */
    .icon-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,.15) 50%, transparent 70%);
      animation: shine 4s ease-in-out infinite;
      border-radius: 8px;
    }
    @keyframes shine {
      0%   { transform: translateX(-100%) translateY(-100%); }
      60%, 100% { transform: translateX(100%) translateY(100%); }
    }

    /* ── Legend below ── */
    .brand-name {
      margin-top: 40px;
      z-index: 1;
      text-align: center;
    }
    .brand-name h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #00d2ff 0%, #a8edff 45%, #3a7bd5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 0 12px rgba(0,210,255,.4));
    }
    .brand-name p {
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 5px;
      color: rgba(130,190,230,.55);
      font-weight: 600;
      text-transform: uppercase;
    }

    /* ── Decorative corner accents ── */
    .corner { position: fixed; width: 80px; height: 80px; opacity: .35; }
    .corner-tl { top: 24px; left: 24px; border-top: 2px solid #00d2ff; border-left: 2px solid #00d2ff; }
    .corner-tr { top: 24px; right: 24px; border-top: 2px solid #00d2ff; border-right: 2px solid #00d2ff; }
    .corner-bl { bottom: 24px; left: 24px; border-bottom: 2px solid #00d2ff; border-left: 2px solid #00d2ff; }
    .corner-br { bottom: 24px; right: 24px; border-bottom: 2px solid #00d2ff; border-right: 2px solid #00d2ff; }

    /* ── Light streak ── */
    .streak {
      position: fixed;
      width: 2px;
      height: 120px;
      background: linear-gradient(to bottom, transparent, rgba(0,210,255,.6), transparent);
      opacity: 0;
      animation: streak-fall 6s ease-in-out infinite;
    }
    .streak:nth-child(1) { left: 15%; top: -120px; animation-delay: 0s; }
    .streak:nth-child(2) { left: 50%; top: -120px; animation-delay: 2.2s; }
    .streak:nth-child(3) { left: 82%; top: -120px; animation-delay: 4s; }

    @keyframes streak-fall {
      0%   { top: -120px; opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: .6; }
      100% { top: 110vh; opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Background grid -->
  <div class="bg-grid"></div>

  <!-- Light streaks -->
  <div class="streak"></div>
  <div class="streak"></div>
  <div class="streak"></div>

  <!-- Corner accents -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- ══════════════════ LOGO SCENE ══════════════════ -->
  <div class="logo-scene">

    <!-- Conic rotating ring -->
    <div class="ring-outer"></div>

    <!-- Glass circle -->
    <div class="logo-circle">

      <!-- Circular text via SVG -->
      <svg class="circular-text" viewBox="0 0 320 320">
        <defs>
          <path id="textCircle"
            d="M 160,160 m -120,0 a 120,120 0 1,1 240,0 a 120,120 0 1,1 -240,0"
          />
        </defs>
        <text>
          <textPath href="#textCircle" startOffset="0%">
            ✦ &nbsp; ONLINE WAREHOUSE &nbsp; ✦ &nbsp; MANAGEMENT SYSTEM &nbsp;
          </textPath>
        </text>
      </svg>

      <!-- Floating cube icon -->
      <div class="icon-wrap">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="130" height="130"
             viewBox="0 0 100 100"
             fill="none">
          <defs>
            <!-- Main cyan gradient -->
            <linearGradient id="gTop" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"   stop-color="#a8f0ff"/>
              <stop offset="100%" stop-color="#00c8f0"/>
            </linearGradient>
            <linearGradient id="gLeft" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"   stop-color="#0090d0"/>
              <stop offset="100%" stop-color="#005090"/>
            </linearGradient>
            <linearGradient id="gRight" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%"   stop-color="#00b8e8"/>
              <stop offset="100%" stop-color="#0070b0"/>
            </linearGradient>
            <!-- Subtle inner grid lines color -->
            <linearGradient id="gGrid" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"   stop-color="rgba(200,245,255,.9)"/>
              <stop offset="100%" stop-color="rgba(0,160,220,.6)"/>
            </linearGradient>
          </defs>

          <!-- ── Isometric warehouse cube ── -->
          <!-- The cube has 3 visible faces: top, left, right -->
          <!-- Centered ~50,50 ; outer extents roughly 18..82 -->

          <!-- LEFT face (dark) -->
          <polygon points="18,50 50,67 50,90 18,73"
                   fill="url(#gLeft)" opacity=".92"/>
          <!-- RIGHT face (medium) -->
          <polygon points="50,67 82,50 82,73 50,90"
                   fill="url(#gRight)" opacity=".96"/>
          <!-- TOP face (bright) -->
          <polygon points="18,50 50,33 82,50 50,67"
                   fill="url(#gTop)" opacity="1"/>

          <!-- ── Inner warehouse grid lines (like original icon) ──
               Vertical dividers on faces, inner room lines -->

          <!-- Top face grid: horizontal ridge center -->
          <line x1="34" y1="41.5" x2="50" y2="50" stroke="rgba(255,255,255,.55)" stroke-width="1"/>
          <line x1="50" y1="50"   x2="66" y2="41.5" stroke="rgba(255,255,255,.55)" stroke-width="1"/>
          <!-- Top face grid: vertical center column -->
          <line x1="50" y1="33" x2="50" y2="67" stroke="rgba(255,255,255,.4)" stroke-width=".8"/>

          <!-- Left face grid: 2 inner shelves -->
          <line x1="18" y1="58" x2="50" y2="75" stroke="rgba(255,255,255,.3)" stroke-width=".8"/>
          <line x1="18" y1="65.5" x2="50" y2="82.5" stroke="rgba(255,255,255,.2)" stroke-width=".8"/>
          <!-- Left face: vertical center post -->
          <line x1="34" y1="58.5" x2="34" y2="81.5" stroke="rgba(255,255,255,.3)" stroke-width=".8"/>

          <!-- Right face grid: 2 inner shelves -->
          <line x1="50" y1="75" x2="82" y2="58" stroke="rgba(255,255,255,.3)" stroke-width=".8"/>
          <line x1="50" y1="82.5" x2="82" y2="65.5" stroke="rgba(255,255,255,.2)" stroke-width=".8"/>
          <!-- Right face: vertical center post -->
          <line x1="66" y1="58.5" x2="66" y2="81.5" stroke="rgba(255,255,255,.3)" stroke-width=".8"/>

          <!-- ── Edge highlights (outer cube borders) ── -->
          <!-- Top edges -->
          <polyline points="18,50 50,33 82,50" stroke="rgba(200,245,255,.9)" stroke-width="1.2" fill="none"/>
          <!-- Vertical edges -->
          <line x1="18" y1="50" x2="18" y2="73" stroke="rgba(200,245,255,.7)" stroke-width="1.2"/>
          <line x1="82" y1="50" x2="82" y2="73" stroke="rgba(200,245,255,.7)" stroke-width="1.2"/>
          <line x1="50" y1="67" x2="50" y2="90" stroke="rgba(200,245,255,.6)" stroke-width="1.1"/>
          <!-- Bottom edges -->
          <polyline points="18,73 50,90 82,73" stroke="rgba(200,245,255,.7)" stroke-width="1.2" fill="none"/>
          <!-- Middle horizontal (top face bottom edge = left+right top) -->
          <polyline points="18,50 50,67 82,50" stroke="rgba(200,245,255,.5)" stroke-width=".9" fill="none"/>

          <!-- Highlight glint on top-left edge -->
          <line x1="34" y1="41.5" x2="18" y2="50" stroke="rgba(255,255,255,.95)" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Brand name below -->
  <div class="brand-name">
    <h1>ONLINE WAREHOUSE</h1>
    <p>Management System</p>
  </div>

</body>
</html>
