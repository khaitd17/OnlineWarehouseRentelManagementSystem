<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;padding:40px 24px 80px}

h1{text-align:center;font-size:1.7rem;font-weight:800;
   background:linear-gradient(135deg,#58a6ff,#bc8cff);
   -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
   margin-bottom:6px}
.subtitle{text-align:center;color:#8b949e;font-size:.875rem;margin-bottom:48px}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;max-width:1400px;margin:0 auto}

/* ---------- actor card ---------- */
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;overflow:hidden}
.card-header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #30363d}
.badge{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.actor-name{font-size:.95rem;font-weight:700}
.actor-sub{font-size:.75rem;color:#8b949e;margin-top:1px}
.uc-count{margin-left:auto;font-size:.72rem;color:#8b949e;background:#0d1117;
          border:1px solid #30363d;border-radius:20px;padding:2px 10px;white-space:nowrap}

.card-body{padding:14px 20px}

/* ---------- group ---------- */
.group{margin-bottom:14px}
.group:last-child{margin-bottom:0}
.group-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
             color:#8b949e;margin-bottom:6px;padding-left:2px}

/* ---------- UC item ---------- */
.uc{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.uc-main{display:flex;align-items:flex-start;gap:8px;padding:5px 8px;border-radius:6px;
         background:#1e2530;border:1px solid transparent;transition:border-color .15s}
.uc-main:hover{border-color:#30363d}
.uc-id{font-size:.7rem;font-weight:700;min-width:32px;padding-top:1px;flex-shrink:0}
.uc-label{font-size:.8rem;line-height:1.4}

/* relationship badges */
.rel{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 28px;font-size:.73rem;color:#8b949e}
.rel-tag{font-size:.65rem;font-weight:600;border-radius:4px;padding:1px 6px;
         white-space:nowrap;flex-shrink:0}
.tag-ext{background:rgba(240,136,62,.15);color:#f0883e;border:1px solid rgba(240,136,62,.3)}
.tag-inc{background:rgba(63,185,80,.15);color:#3fb950;border:1px solid rgba(63,185,80,.3)}
.tag-spc{background:rgba(188,140,255,.15);color:#bc8cff;border:1px solid rgba(188,140,255,.3)}

/* ---------- legend ---------- */
.legend{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-bottom:32px;max-width:1400px;margin-inline:auto;margin-bottom:32px}
.leg-item{display:flex;align-items:center;gap:6px;font-size:.75rem;color:#8b949e}
.leg-tag{font-size:.65rem;font-weight:600;border-radius:4px;padding:1px 7px}
</style>

const REL_MAP = {
  'ext': {tag:'extend',    cls:'tag-ext'},
  'inc': {tag:'include',   cls:'tag-inc'},
  'spc': {tag:'specialization', cls:'tag-spc'},
};

function countUCs(actor){
  let n = 0;
  actor.groups.forEach(g => {
    g.ucs.forEach(u => { n++; if(u.rels) n += u.rels.length; });
  });
  return n;
}

function buildCard(actor){
  const card = document.createElement('div');
  card.className = 'card';

  const header = document.createElement('div');
  header.className = 'card-header';
  header.innerHTML = `
    <div class="badge" style="background:${actor.color}"></div>
    <div>
      <div class="actor-name" style="color:${actor.color}">${actor.name}</div>
      <div class="actor-sub">${actor.sub}</div>
    </div>
    <div class="uc-count">${countUCs(actor)} UC</div>`;
  card.appendChild(header);

  const body = document.createElement('div');
  body.className = 'card-body';

  actor.groups.forEach(g => {
    const grp = document.createElement('div');
    grp.className = 'group';
    const lbl = document.createElement('div');
    lbl.className = 'group-label';
    lbl.textContent = g.label;
    grp.appendChild(lbl);

    g.ucs.forEach(u => {
      const wrap = document.createElement('div');
      wrap.className = 'uc';

      const main = document.createElement('div');
      main.className = 'uc-main';
      main.innerHTML = `<span class="uc-id" style="color:${actor.color}">(${u.id})</span><span class="uc-label">${u.label}</span>`;
      wrap.appendChild(main);

      if(u.rels){
        u.rels.forEach(r => {
          const m = REL_MAP[r.tag];
          const rel = document.createElement('div');
          rel.className = 'rel';
          rel.innerHTML = `<span class="rel-tag ${m.cls}">&lt;&lt;${m.tag}&gt;&gt;</span>
            <span style="color:#8b949e">(${r.id})</span> ${r.label}`;
          wrap.appendChild(rel);
        });
      }

      grp.appendChild(wrap);
    });
    body.appendChild(grp);
  });

  card.appendChild(body);
  return card;
}

const grid = document.getElementById('grid');
ACTORS.forEach(a => grid.appendChild(buildCard(a)));
